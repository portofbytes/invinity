name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (OpenNext for Cloudflare)
        env:
          # Public app variables — safe to expose at build time.
          NEXT_PUBLIC_SITE_URL:      ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ANALYTICS_ID:  ${{ vars.NEXT_PUBLIC_ANALYTICS_ID }}
          # Server env — read at runtime by the Worker, but harmless to set
          # here too so `next build` can validate.
          SQUARESPACE_STORE_URL:     ${{ vars.SQUARESPACE_STORE_URL }}
          SQUARESPACE_API_KEY:       ${{ secrets.SQUARESPACE_API_KEY }}
          SANITY_PROJECT_ID:         ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET:            ${{ vars.SANITY_DATASET }}
          SANITY_READ_TOKEN:         ${{ secrets.SANITY_READ_TOKEN }}
          EMAIL_FROM:                ${{ vars.EMAIL_FROM }}
          EMAIL_TO_HOUSE:            ${{ vars.EMAIL_TO_HOUSE }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
